<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="x-ua-compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="icon" href="data:;">
  <link rel="stylesheet" th:href="@{/assets/style/common.css}">
  <link rel="stylesheet" th:href="@{/assets/style/login.css}">
</head>

<body>
<div class="header">
  <span th:text="${tenantName}" class="logo"></span>
</div>
<div class="content">
  <div class="login-box">
    <div class="form-left">
      <img th:src="@{/assets/img/login.png}" alt="">
    </div>
    <div class="form-right">
      <div class="title">登录</div>
      <form th:action="@{/login/account}" method="post" class="form-wrapper">
        <label>
          <input type="text" name="username" placeholder="请输入用户名" required />
        </label>
        <label>
          <input type="password" name="password" placeholder="请输入密码" required />
        </label>
        <div th:if="${param?.error != null && session?.SPRING_SECURITY_LAST_EXCEPTION != null}" class="error">
          <span th:text="${session.SPRING_SECURITY_LAST_EXCEPTION?.message}"></span>
        </div>
        <button type="submit">立即登录</button>
      </form>
    </div>
  </div>
</div>
<div class="footer" th:text="${tenantCopyright}"></div>
</body>

</html>
