databaseChangeLog:
  - changeSet:
      id: 0.0.1-SNAPSHOT
      author: hejun.dev@qq.com
      changes:
        - createTable:
            tableName: t_tenant
            remarks: "租户"
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: "ID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  remarks: "租户名"
                  constraints:
                    nullable: false
              - column:
                  name: issuer
                  type: varchar(100)
                  remarks: "发行域名"
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_tenant_issuer
              - column:
                  name: public_key
                  type: varchar(1000)
                  remarks: "公钥"
                  constraints:
                    nullable: false
              - column:
                  name: private_key
                  type: varchar(2000)
                  remarks: "私钥"
                  constraints:
                    nullable: false
              - column:
                  name: copyright
                  type: varchar(200)
                  remarks: "版权"
              - column:
                  name: enabled
                  type: bit(1)
                  remarks: "是否启用, 0: 否, 1: 是. 默认: 1"
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: created_date
                  type: timestamp
                  remarks: "创建时间"
                  constraints:
                    nullable: false
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: last_modified_date
                  type: timestamp
                  remarks: "最后更新时间"
                  defaultValueComputed: "NULL ON UPDATE CURRENT_TIMESTAMP"
        - createTable:
            tableName: t_client
            remarks: "客户端"
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: "ID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: client_id
                  type: varchar(50)
                  remarks: "客户端ID"
                  constraints:
                    nullable: false
              - column:
                  name: client_secret
                  type: varchar(100)
                  remarks: "客户端密钥"
              - column:
                  name: client_name
                  type: varchar(50)
                  remarks: "客户端名称"
              - column:
                  name: client_authentication_methods
                  type: varchar(150)
                  remarks: "认证方式"
              - column:
                  name: authorization_grant_types
                  type: varchar(300)
                  remarks: "授权方式"
              - column:
                  name: redirect_uris
                  type: varchar(500)
                  remarks: "回调地址"
              - column:
                  name: post_logout_redirect_uris
                  type: varchar(500)
                  remarks: "登出跳转地址"
              - column:
                  name: scopes
                  type: varchar(150)
                  remarks: "授权域"
              - column:
                  name: require_proof_key
                  type: bit(1)
                  remarks: "是否开启密码验证(PKCE模式), 0: 否, 1: 是"
              - column:
                  name: require_authorization_consent
                  type: bit(1)
                  remarks: "是否需要确认授权, 0: 否, 1: 是"
              - column:
                  name: access_token_time_to_live
                  type: int
                  remarks: "AccessToken存活时间,单位: 秒"
              - column:
                  name: refresh_token_time_to_live
                  type: int
                  remarks: "RefreshToken存活时间,单位: 秒"
              - column:
                  name: enabled
                  type: bit(1)
                  remarks: "是否启用, 0: 否, 1: 是. 默认: 1"
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: tenant_id
                  type: bigint
                  remarks: "所属租户ID"
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  remarks: "创建时间"
                  constraints:
                    nullable: false
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: last_modified_date
                  type: timestamp
                  remarks: "最后更新时间"
                  defaultValueComputed: "NULL ON UPDATE CURRENT_TIMESTAMP"
        - createTable:
            tableName: t_user
            remarks: "用户"
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: "ID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(20)
                  remarks: "账户"
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: varchar(100)
                  remarks: "密码"
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(100)
                  remarks: "邮箱"
              - column:
                  name: email_verified
                  type: bit(1)
                  remarks: "邮箱是否已验证, 0: 否, 1: 是. 默认: 0"
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: phone_number
                  type: varchar(20)
                  remarks: "电话"
              - column:
                  name: phone_number_verified
                  type: bit(1)
                  remarks: "电话是否已验证, 0: 否, 1: 是. 默认: 0"
                  constraints:
                    nullable: false
                  defaultValueBoolean: false
              - column:
                  name: nickname
                  type: varchar(50)
                  remarks: "昵称"
              - column:
                  name: gender
                  type: tinyint
                  remarks: "性别, 1: 男, 2: 女. 默认: 1"
                  constraints:
                    nullable: false
                  defaultValueNumeric: "1"
              - column:
                  name: avatar
                  type: varchar(200)
                  remarks: "头像"
              - column:
                  name: birthdate
                  type: date
                  remarks: "生日"
              - column:
                  name: enabled
                  type: bit(1)
                  remarks: "是否启用, 0: 否, 1: 是. 默认: 1"
                  constraints:
                    nullable: false
                  defaultValueBoolean: true
              - column:
                  name: tenant_id
                  type: bigint
                  remarks: "所属租户ID"
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  remarks: "创建时间"
                  constraints:
                    nullable: false
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: last_modified_date
                  type: timestamp
                  remarks: "最后更新时间"
                  defaultValueComputed: "NULL ON UPDATE CURRENT_TIMESTAMP"
        - createTable:
            tableName: t_consent
            remarks: "用户-客户端授权"
            columns:
              - column:
                  name: user_id
                  type: bigint
                  remarks: "用户ID"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_consent
                    nullable: false
              - column:
                  name: client_id
                  type: bigint
                  remarks: "客户端ID"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_consent
                    nullable: false
              - column:
                  name: authorities
                  type: varchar(1000)
                  remarks: "授权"
        - createTable:
            tableName: t_role
            remarks: "角色"
            columns:
              - column:
                  name: id
                  type: bigint
                  remarks: "ID"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(20)
                  remarks: "角色代码"
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(20)
                  remarks: "角色名"
                  constraints:
                    nullable: false
              - column:
                  name: parent_role_id
                  type: bigint
                  remarks: "父级角色ID"
              - column:
                  name: tenant_id
                  type: bigint
                  remarks: "所属租户ID"
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  remarks: "创建时间"
                  constraints:
                    nullable: false
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: last_modified_date
                  type: timestamp
                  remarks: "最后更新时间"
                  defaultValueComputed: "NULL ON UPDATE CURRENT_TIMESTAMP"
        - createTable:
            tableName: t_user_role
            remarks: "用户-角色-关联表"
            columns:
              - column:
                  name: user_id
                  type: bigint
                  remarks: "用户ID"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_role
                    nullable: false
              - column:
                  name: role_id
                  type: bigint
                  remarks: "角色ID"
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_role
                    nullable: false
        - createIndex:
            tableName: t_role
            indexName: idx_role_tenant_parent_role
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: parent_role_id
        - createIndex:
            tableName: t_user_role
            indexName: idx_user_role_role_id
            columns:
              - column:
                  name: role_id
        - addUniqueConstraint:
            tableName: t_client
            constraintName: uk_client_tenant_id_client_id
            columnNames: tenant_id,client_id
        - addUniqueConstraint:
            tableName: t_user
            constraintName: uk_user_tenant_id_username
            columnNames: tenant_id, username
        - addUniqueConstraint:
            tableName: t_role
            constraintName: uk_role_tenant_id_code
            columnNames: tenant_id,code